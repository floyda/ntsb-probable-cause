[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ntsb-probable-cause"
version = "0.3.0"
description = "An agent that determines the probable cause of US general-aviation accidents, scored against NTSB verdicts."
readme = "README.md"
license = "MIT"
requires-python = "==3.14.*"
dependencies = [
    "httpx>=0.28.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    # pypdf[crypto] pulls in `cryptography`. Without it pypdf falls back to a pure-Python RC4
    # implementation that allocates one Python int per byte of every encrypted stream, and NTSB
    # docket PDFs are routinely encrypted with an empty user password. Measured over 40 dev cases:
    # 11.4 GB of the 24.1 GB total allocation came from that fallback, and resident growth per case
    # fell from 17.9 MB to 9.2 MB once it was installed. Not an optional speed-up -- the pure-Python
    # path is what made a 400-case run get killed for memory.
    "pypdf[crypto]>=6.19.0",
]

[project.scripts]
ntsb-ingest = "apps.ingest.__main__:main"
ntsb-eval = "apps.eval.__main__:main"
ntsb-record = "apps.recorder.__main__:main"

[project.optional-dependencies]
# The recorder's S3 store sync (`store/sync.py`, Task 10) needs this only behind an `s3://`
# store location; imported lazily in `s3_client()`. `uv sync` (no `--extra`) never installs it
# -- a local store, and every test, run without it -- so `uv sync --extra aws` is required on
# any machine that will use an `s3://` store (the container image, Task 12).
aws = [
    "boto3>=1.43.100",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ntsb_probable_cause", "apps"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "apps", "scripts", "tests", "infra"]
extend-exclude = ["docs", "scripts/exploratory"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "PT", "D", "PL", "RUF", "N", "C4", "PTH", "TRY", "ERA", "T20"]
ignore = ["D105", "D107", "TRY003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "PLR2004"]
"scripts/**" = ["T201"]
"apps/**" = ["T201"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
files = ["src", "apps", "scripts", "tests", "infra"]
exclude = ["^scripts/exploratory/"]
mypy_path = ["src", "infra"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# boto3/botocore are the optional `aws` extra (controller note 3): not installed by a plain
# `uv sync`, and imported lazily only inside `store/sync.py:s3_client()`. No type stubs pinned
# for them, since the module's own S3Like Protocol is the only typed surface this project
# depends on.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--disable-socket --cov=ntsb_probable_cause --cov-branch --cov-report=term-missing --cov-fail-under=90"
pythonpath = ["."]
testpaths = ["tests"]

[tool.importlinter]
root_packages = ["ntsb_probable_cause", "apps"]

[[tool.importlinter.contracts]]
name = "The library never imports apps"
type = "forbidden"
source_modules = ["ntsb_probable_cause"]
forbidden_modules = ["apps"]

[[tool.importlinter.contracts]]
name = "Only the splitter constructs synthesis and verdict"
type = "forbidden"
source_modules = [
    "ntsb_probable_cause.data",
    "ntsb_probable_cause.docket",
    "ntsb_probable_cause.fields",
    "ntsb_probable_cause.paths",
    "ntsb_probable_cause.splits",
    "ntsb_probable_cause.sources",
    "ntsb_probable_cause.settings",
    "ntsb_probable_cause.errors",
    "ntsb_probable_cause.records.evidence",
    "ntsb_probable_cause.records.guard",
    "ntsb_probable_cause.model",
    "ntsb_probable_cause.scoring.baseline",
    "ntsb_probable_cause.scoring.codes",
    "ntsb_probable_cause.scoring.hypothesis",
    "ntsb_probable_cause.scoring.prompt",
    "ntsb_probable_cause.scoring.samples",
    "ntsb_probable_cause.store",
    "ntsb_probable_cause.recorder",
    "ntsb_probable_cause.gitinfo",
]
forbidden_modules = ["ntsb_probable_cause.records.synthesis", "ntsb_probable_cause.records.verdict"]
# Task 7: the recorder's case side calls split_record itself (CLAUDE.md rule 1) and discards
# the Synthesis/Verdict it returns; that necessary call is the only edge exempted, so the
# recorder still cannot import records.synthesis or records.verdict directly, or by any other
# path.
ignore_imports = ["ntsb_probable_cause.recorder.cases -> ntsb_probable_cause.records.split"]

[[tool.importlinter.contracts]]
name = "The model boundary cannot see synthesis or verdict"
type = "forbidden"
source_modules = ["ntsb_probable_cause.model"]
forbidden_modules = [
    "ntsb_probable_cause.records.synthesis",
    "ntsb_probable_cause.records.verdict",
    "ntsb_probable_cause.records.split",
    "ntsb_probable_cause.scoring",
]

[tool.deptry]
# `recorder_stack` (infra/app.py's plain, unqualified `from recorder_stack import ...`) is this
# project's own CDK stack module, not a third-party package -- CDK's own convention is a flat
# `app.py` next to the stack file it imports, with no package wrapper, so there is no dotted
# package name to list here instead.
known_first_party = ["ntsb_probable_cause", "apps", "scripts", "recorder_stack"]
extend_exclude = ["scripts/exploratory"]

[tool.deptry.per_rule_ignores]
# `botocore` is boto3's own dependency, never installed or imported directly by this project;
# `store/sync.py:s3_client()` imports `botocore.exceptions.ClientError` alongside the lazy
# `boto3` import (controller note 3) only to translate one boto3 error into `ObjectNotFoundError`.
DEP001 = ["botocore"]
# `aws-cdk-lib` and `constructs` are deliberately dev dependencies, not runtime ones (Task 13
# controller note 4): `infra/` is deploy-time tooling that runs on Andy's machine through `cdk
# synth`/`cdk deploy`, never inside the container image (`.dockerignore` excludes `infra/`,
# Task 12) and never imported by `src`/`apps`. The same reasoning already applies to this
# project's dev-only test and lint tooling; this is that same shape of dependency, not product
# code that happens to be misclassified.
DEP004 = ["aws_cdk", "constructs"]

[tool.vulture]
paths = ["src", "apps", "scripts", "infra"]
exclude = ["scripts/exploratory"]
min_confidence = 80

[tool.typos.default]
# The provider's batch ids are opaque random strings quoted verbatim (decision 0032 names
# four of them, and run notes name more). They are evidence of real spending, so they are
# never reworded; "LFofWWoQzHwuChB7kK27" is not a misspelling of anything.
extend-ignore-re = [
    "batch-[0-9]+-[A-Za-z0-9]+",
    # Short git SHAs, quoted verbatim wherever a run's provenance is recorded (0018) and
    # throughout 0036's old -> new mapping table. Hex digits spell words by accident:
    # `f93ba36` contains "ba", which the checker reads as a typo for "by".
    "`[0-9a-f]{7,40}`",
]

[tool.typos.default.extend-words]
# NTSB abbreviations that are not misspellings go here, one per line, with a comment.
mis = "mis" # first half of the hyphenated "mis-pointed" in docs/decisions/0016; not a misspelling

[tool.typos.files]
# Real NTSB case numbers, IDs and abbreviations (e.g. "ANC...", "HOM", "TPE") trigger many false
# positives; these are redacted, verbatim NTSB record fixtures, not authored text (decision 0015).
# The scoring/tables CSVs are verbatim labels from the NTSB data dictionary (avall.mdb), not
# authored text either; they also trigger false positives (e.g. "VOR", "WAAS", "Unneccessary",
# both spelled that way in the source data). The openrouter fixtures are verbatim, saved
# OpenRouter responses (scripts/openrouter_probe.py); batch.json's base64 batch-file payload
# trips many false positives.
extend-exclude = [
    "tests/fixtures/records/*.json",
    "tests/fixtures/api/*.json",
    "tests/fixtures/eval/*.csv",
    # README.md's provenance line embeds a generated short git SHA (decision 0015), which
    # occasionally spells a false positive (e.g. "1f768ba" contains "ba").
    "tests/fixtures/eval/README.md",
    "tests/fixtures/openrouter/*.json",
    "src/ntsb_probable_cause/scoring/tables/*.csv",
]

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.24",
    "aws-cdk-lib>=2.270.0",
    "constructs>=10.8.1",
    "deptry>=0.25.1",
    "grimp>=3.17",
    "hypothesis>=6.168.0",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pre-commit-hooks>=6.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "pyyaml>=6.0.3",
    "respx>=0.23.1",
    "ruff>=0.16.7",
    "types-pyyaml>=6.0.12.20260906",
    "typos>=1.50.1",
    "vulture>=2.16",
    "zizmor>=1.30.1",
]
