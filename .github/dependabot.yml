version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # Wait a week after a release before proposing it (default 3 days):
    # most poisoned releases are caught and pulled within days.
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    # Same cooldown as uv's, and as pnpm's own minimum release age (S5 spec §17.2).
    cooldown:
      default-days: 7
