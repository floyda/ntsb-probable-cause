name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      # /usr/share/dict/words. scripts/check_fixtures_redacted.py checks a committed docket
      # title's capitalised words against the committed vocabulary AND this list; without it
      # the vocabulary alone flags 158 blocking false positives on the hand-check sheet and
      # every job that runs the check fails. macOS ships a word list, ubuntu-latest does not,
      # which is why this was invisible locally (decision 0058).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq wamerican
      - run: uv sync --locked
      - run: SKIP=no-commit-to-branch uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run pre-commit run --hook-stage manual check-added-large-files-all --all-files --show-diff-on-failure
      - name: Download gitleaks (verified checksum)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan full git history for secrets
        run: ./gitleaks git --redact --verbose .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      # /usr/share/dict/words. scripts/check_fixtures_redacted.py checks a committed docket
      # title's capitalised words against the committed vocabulary AND this list; without it
      # the vocabulary alone flags 158 blocking false positives on the hand-check sheet and
      # every job that runs the check fails. macOS ships a word list, ubuntu-latest does not,
      # which is why this was invisible locally (decision 0058).
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq wamerican
      - run: uv sync --locked
      - run: uv run pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pip-audit
