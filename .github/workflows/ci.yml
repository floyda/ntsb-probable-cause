name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # The site's hooks need pnpm; the `site` job below runs the same checks.
      - run: SKIP=no-commit-to-branch,site-lint,site-format,site-check uv run pre-commit run --all-files --show-diff-on-failure
      - run: uv run pre-commit run --hook-stage manual check-added-large-files-all --all-files --show-diff-on-failure
      - name: Download gitleaks (verified checksum)
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan full git history for secrets
        run: ./gitleaks git --redact --verbose .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The site's numbers name the commit that recorded each results file (S5 step 5),
          # which a shallow checkout cannot see.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pip-audit

  # The site (S5 spec §17.2, §19.2): installs exactly the lockfile, then every check. No AWS
  # credentials; nothing is published from CI (CodeBuild publishes, spec §18). No `cache:` on
  # setup-node: a cache shared across branches is a poisoning route, and the install is small.
  # setup-node is v7.0.0, not v7.1.0: the 7-day rule applies to actions too (v7.1.0 is from
  # 2026-10-08).
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The Methods page's checks read each results file at the commit that recorded it
          # (S5 step 5), which a shallow checkout cannot see.
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run check
      - run: pnpm run types:check
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:a11y
      - run: pnpm audit --audit-level moderate

  # Builds the recorder's container image (Dockerfile, S2.5 Task 12) on every push and pull
  # request, so a broken Dockerfile is caught before merge -- the daemon this build needs is
  # not available in a developer's sandboxed session, so this job is the substitute for a
  # local `docker build`. Never pushes and never touches AWS credentials.
  image-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image (no push)
        run: |
          set -euo pipefail
          docker build --build-arg "COMMIT_SHA=${GITHUB_SHA:0:7}" -t ntsb-recorder:ci .

  # Pushes the image built above to ECR, only from a merge to `main` -- never from a pull
  # request, which could come from a fork with no business holding this project's AWS
  # credentials. `id-token: write` (for the GitHub OIDC exchange `aws-actions/
  # configure-aws-credentials` performs) is scoped to this job alone, not the whole workflow,
  # per controller note 3. `needs` also names `lint` and `test` (fix round 1, Minor 3), not
  # only `image-build`: `needs` requires every listed job to succeed, so a commit that fails
  # lint or the test suite can reach `main` (nothing here blocks that merge) but its image is
  # never pushed. `concurrency` (fix round 1, Minor 4) serializes pushes across quick
  # back-to-back merges so `:latest` always ends up as the most recent successful build, never
  # whichever run's push happened to finish last; `cancel-in-progress: false` because a
  # half-finished push must never be interrupted mid-way and left as `:latest`.
  image-push:
    needs: [image-build, lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: image-push
      cancel-in-progress: false
    permissions:
      # OIDC exchange for aws-actions/configure-aws-credentials (fix round 1, Minor 8).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the deploy role is configured
        id: role
        env:
          # Repository variable, created by the CDK stack in Task 13 (spec §9.2). Read into an
          # env var here, never interpolated directly into a run script, so a `run:` step never
          # substitutes an `${{ }}` expression through the shell.
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          if [ -z "$ROLE_ARN" ]; then
            echo "::notice::AWS_DEPLOY_ROLE_ARN is not set (Task 13's stack is not deployed yet) -- skipping the image push."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        if: steps.role.outputs.configured == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-2
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
        if: steps.role.outputs.configured == 'true'
        id: ecr-login
      - name: Build and push image
        if: steps.role.outputs.configured == 'true'
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          docker build \
            --build-arg "COMMIT_SHA=$short_sha" \
            -t "$ECR_REGISTRY/ntsb-recorder:$short_sha" \
            -t "$ECR_REGISTRY/ntsb-recorder:latest" \
            .
          docker push "$ECR_REGISTRY/ntsb-recorder:$short_sha"
          docker push "$ECR_REGISTRY/ntsb-recorder:latest"
